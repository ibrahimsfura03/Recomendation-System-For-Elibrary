{% extends "base.html" %}

{% block content %}
<style>
    .login-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 60px);
    }
    
    .login-card {
        width: 100%;
        max-width: 450px;
    }
</style>

<div class="login-wrapper">
    <div class="login-card">
        <div class="card border-0 shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center" style="color: var(--primary-teal);">User Login</h3>

                {% if error %}
                <div class="alert alert-danger alert-dismissible fade show" role="alert">
                    {{ error }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
                {% endif %}

                <form action="/login" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Username or Email</label>
                        <input type="text" class="form-control" name="identifier" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <button type="submit" class="btn w-100 mb-3 text-white" style="background-color: var(--primary-teal);">Login</button>
                </form>

                <hr>

                <p class="text-center text-muted mb-2">
                    Don't have an account? <a href="/signup" style="color: var(--primary-teal);">Sign up here</a>
                </p>

                <p class="text-center text-muted small mb-0">
                    <a href="/author/login" style="color: var(--primary-teal);">Author Login</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
