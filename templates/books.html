{% extends "base.html" %}

{% block content %}
<h2 class="mb-4">Book Catalog</h2>

<div class="table-responsive">
    <table class="table table-bordered table-hover">
        <thead class="bg-light">
            <tr>
                <th>Title</th>
                <th>Author</th>
                <th>Book ID</th>
                <th>Genre</th>
            </tr>
        </thead>
        <tbody>
            {% for book in books %}
            <tr>
                <td>{{ book.title }}</td>
                <td>{{ book.author }}</td>
                <td>{{ book.book_id }}</td>
                <td>{{ book.category if book.category else 'N/A' }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
{% endblock %}
