{% extends "base.html" %}

{% block content %}
<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 mb-4">
            <div class="card mb-3 border-0 shadow-sm">
                <div class="card-body">
                    <h6 class="card-title"><i class="fas fa-pen-fancy"></i> Author</h6>
                    <p class="card-text small text-muted">Manage Your Books</p>
                </div>
            </div>

            <div class="list-group">
                <a href="/author/dashboard" class="list-group-item list-group-item-action">
                    <i class="fas fa-tachometer-alt"></i> Dashboard
                </a>
                <a href="/author/upload-book" class="list-group-item list-group-item-action">
                    <i class="fas fa-upload"></i> Upload Book
                </a>
                <a href="/author/my-books" class="list-group-item list-group-item-action active">
                    <i class="fas fa-book"></i> My Books
                </a>
                <a href="/logout" class="list-group-item list-group-item-action text-danger">
                    <i class="fas fa-sign-out-alt"></i> Logout
                </a>
            </div>
        </div>

        <!-- Main Content -->
        <div class="col-md-9">
            <h2 class="mb-4"><i class="fas fa-edit"></i> Edit Book</h2>

            <div class="card border-0 shadow-sm">
                <div class="card-body">
                    <form action="/author/edit-book/{{ book.book_id }}" method="POST">
                        <div class="row mb-3">
                            <div class="col-md-6">
                                <label class="form-label"><i class="fas fa-info-circle"></i> Book ID (Read-only)</label>
                                <input type="text" class="form-control" value="{{ book.book_id }}" disabled>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label"><i class="fas fa-tag"></i> Status</label>
                                <input type="text" class="form-control" value="{{ book.get('status', 'pending') }}" disabled>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-heading"></i> Book Title *</label>
                            <input type="text" class="form-control" name="title" value="{{ book.title }}" required>
                        </div>

                        <div class="row">
                            <div class="col-md-6 mb-3">
                                <label class="form-label"><i class="fas fa-tag"></i> Category *</label>
                                <select class="form-select" name="category" required>
                                    <option value="">Select a category...</option>
                                    {% if categories %}
                                        {% for cat in categories %}
                                        <option value="{{ cat }}" {% if cat == book.category %}selected{% endif %}>{{ cat }}</option>
                                        {% endfor %}
                                    {% endif %}
                                </select>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label"><i class="fas fa-align-left"></i> Description</label>
                            <textarea class="form-control" name="description" rows="5">{{ book.get('description', '') }}</textarea>
                        </div>

                        {% if book.get('status') == 'rejected' %}
                        <div class="alert alert-warning mb-3">
                            <i class="fas fa-exclamation-triangle"></i> <strong>Rejection Reason:</strong><br>
                            {{ book.get('reason', 'No reason provided') }}
                        </div>
                        {% endif %}

                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-primary btn-lg">
                                <i class="fas fa-save"></i> Save Changes
                            </button>
                            <a href="/author/my-books" class="btn btn-outline-secondary">
                                <i class="fas fa-arrow-left"></i> Back to My Books
                            </a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
