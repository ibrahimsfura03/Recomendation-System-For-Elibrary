{% extends "base.html" %}

{% block content %}
<style>
    .signup-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 60px);
    }
    
    .signup-card {
        width: 100%;
        max-width: 450px;
    }
</style>

<div class="signup-wrapper">
    <div class="signup-card">
        <div class="card border-0 shadow">
            <div class="card-body p-4">
                <h3 class="card-title mb-4 text-center" style="color: var(--primary-teal);">Create Account</h3>

                {% if errors %}
                    {% for err in errors %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ err }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}

                <form action="/signup" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Full Name</label>
                        <input type="text" class="form-control" name="full_name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" class="form-control" name="username" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" class="form-control" name="email" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Preferred Category (Optional)</label>
                        <select class="form-select" name="category">
                            <option value="">Select a category...</option>
                            {% if categories %}
                                {% for cat in categories %}
                                <option value="{{ cat }}">{{ cat }}</option>
                                {% endfor %}
                            {% endif %}
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Password</label>
                        <input type="password" class="form-control" name="password" required>
                    </div>

                    <div class="mb-4">
                        <label class="form-label">Confirm Password</label>
                        <input type="password" class="form-control" name="confirm_password" required>
                    </div>

                    <button type="submit" class="btn w-100 mb-3 text-white" style="background-color: var(--primary-teal);">Create Account</button>
                </form>

                <hr>

                <p class="text-center text-muted mb-0">
                    Already have an account? <a href="/login" style="color: var(--primary-teal);">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
