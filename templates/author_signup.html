{% extends "base.html" %}

{% block content %}
<div class="row">
    <div class="col-md-7 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <h3 class="card-title mb-4">Register as Author</h3>

                {% if errors %}
                    {% for err in errors %}
                    <div class="alert alert-danger alert-dismissible fade show" role="alert">
                        {{ err }}
                        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                    </div>
                    {% endfor %}
                {% endif %}

                <form action="/author/signup" method="POST">
                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Full Name *</label>
                            <input type="text" class="form-control" name="full_name" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Username *</label>
                            <input type="text" class="form-control" name="username" required>
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Email *</label>
                            <input type="email" class="form-control" name="email" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Phone *</label>
                            <input type="tel" class="form-control" name="phone" required>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Biography</label>
                        <textarea class="form-control" name="biography" rows="3" placeholder="Tell us about yourself..."></textarea>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Institution</label>
                            <input type="text" class="form-control" name="institution">
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Area of Expertise</label>
                            <input type="text" class="form-control" name="expertise">
                        </div>
                    </div>

                    <div class="row">
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Password *</label>
                            <input type="password" class="form-control" name="password" required>
                        </div>
                        <div class="col-md-6 mb-3">
                            <label class="form-label">Confirm Password *</label>
                            <input type="password" class="form-control" name="confirm_password" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-primary w-100 mb-3">Register</button>
                </form>

                <hr>
                <p class="text-center text-muted">
                    Already registered? <a href="/author/login">Login here</a>
                </p>
            </div>
        </div>
    </div>
</div>
{% endblock %}
